name: Aftermath overlay

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  offline-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
      - name: Standard-library tests with network denied
        run: python3 ci/run_offline_tests.py
      - name: Generated catalogs are current
        run: python3 tools/generate_coverage.py --check
      - name: Upstream pin and source tree are exact
        run: python3 tools/sync_upstream.py --check
      - name: Pinned upstream strategy sources are untouched
        shell: bash
        run: |
          pin="$(cat UPSTREAM_REF)"
          git cat-file -e "${pin}^{commit}"
          git diff --exit-code "${pin}" -- strategies
      - name: Attribution, offline, and runnable-package policy
        run: python3 tools/lint_overlay.py
      - name: Aftermath skills contract and vendored bytes
        run: python3 tools/validate_skills_contract.py
      - name: Doctor preflight runs offline and reports a missing wallet
        run: |
          python3 -m aftermath_runtime coverage
          if python3 -m aftermath_runtime doctor; then
            echo "doctor exited 0 with no wallet configured" >&2
            exit 1
          fi
          AF_WALLET_ADDRESS=0x$(printf 'ab%.0s' $(seq 32)) \
            python3 -m aftermath_runtime doctor
      - name: Upstream Rooster tests
        run: python3 strategies/rooster/tests/test_engine.py
      - name: Upstream Rooster strategy validation
        run: python3 senpi-strategy-author/scripts/validate_strategy.py strategies/rooster
